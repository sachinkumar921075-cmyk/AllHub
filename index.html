<!DOCTYPE html>
<html lang="en" data-theme="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AllHub — Personal Directory</title>
<style>
:root{--bg:#0b0c10;--bg2:#12141c;--card:#161925;--card-h:#1e2235;--text:#e2e4f0;--text2:#8b8fa3;--accent:#7c5cfc;--accent2:#a78bfa;--border:#232738;--glow:rgba(124,92,252,.15);--radius:14px;--radius-sm:10px}
[data-theme="1"]{--bg:#080f1a;--bg2:#0c1525;--card:#0f1b2e;--card-h:#152240;--text:#e0eaf5;--text2:#6e94b0;--accent:#0ea5e9;--accent2:#38bdf8;--border:#162a45;--glow:rgba(14,165,233,.15)}
[data-theme="2"]{--bg:#0e0b10;--bg2:#14101a;--card:#1a1520;--card-h:#251e30;--text:#e8e0f0;--text2:#9e8aaa;--accent:#e879f9;--accent2:#f0abfc;--border:#2a2038;--glow:rgba(232,121,249,.15)}
[data-theme="3"]{--bg:#0a0e0b;--bg2:#0e1610;--card:#121c14;--card-h:#1a2820;--text:#e0f0e4;--text2:#7ea88e;--accent:#34d399;--accent2:#6ee7b7;--border:#1a3028;--glow:rgba(52,211,153,.15)}
[data-theme="4"]{--bg:#120b0b;--bg2:#1c1212;--card:#251618;--card-h:#301e20;--text:#f0e0e0;--text2:#b07e7e;--accent:#f87171;--accent2:#fca5a5;--border:#382022;--glow:rgba(248,113,113,.15)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .3s}
a{color:inherit;text-decoration:none}

/* ── Navbar ── */
.navbar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;backdrop-filter:blur(12px);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.logo{font-size:1.15rem;font-weight:700;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:.4rem}
.logo svg{width:22px;height:22px}
.nav-3d{display:flex;gap:.45rem;overflow-x:auto;padding:.2rem 0;-webkit-overflow-scrolling:touch;flex:1;min-width:0;scrollbar-width:none}
.nav-3d::-webkit-scrollbar{display:none}
.nav-pill{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:.4rem .9rem;border-radius:var(--radius-sm);font-size:.82rem;cursor:pointer;white-space:nowrap;transition:all .2s;user-select:none;font-weight:500;position:relative}
.nav-pill:hover{color:var(--text);background:var(--card-h);border-color:var(--accent)}
.nav-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 12px var(--glow)}

/* ── Search ── */
.search-wrap{padding:.75rem 1.5rem .25rem;display:flex;justify-content:center}
.search-box{position:relative;width:100%;max-width:480px}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text2);pointer-events:none}
.search-box input{width:100%;padding:.65rem 1rem .65rem 2.6rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s,box-shadow .2s}
.search-box input::placeholder{color:var(--text2)}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}

/* ── Stats bar ── */
.stats{padding:.25rem 1.5rem .5rem;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--text2)}
.stats span{background:var(--card);padding:.2rem .6rem;border-radius:6px;border:1px solid var(--border)}

/* ── Main grid ── */
.main{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.75rem;padding:.5rem 1.5rem 2rem;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;transition:all .25s;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.35rem}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .25s}
.card:hover{background:var(--card-h);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px var(--glow)}
.card:hover::before{opacity:1}
.card-name{font-weight:600;font-size:.95rem;color:var(--text)}
.card-url{font-size:.75rem;color:var(--text2);word-break:break-all;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card-badge{position:absolute;top:.7rem;right:.7rem;display:flex;gap:.3rem}
.badge{font-size:.6rem;padding:.15rem .45rem;border-radius:5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.badge-trusted{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.badge-new{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.card .arrow{position:absolute;bottom:.7rem;right:.7rem;width:20px;height:20px;color:var(--text2);opacity:0;transform:translateX(-4px);transition:all .2s}
.card:hover .arrow{opacity:1;transform:translateX(0);color:var(--accent)}

/* ── No results ── */
.no-results{display:none;text-align:center;padding:4rem 1.5rem;color:var(--text2)}
.no-results svg{width:48px;height:48px;margin-bottom:.75rem;opacity:.4}
.no-results.show{display:block}

/* ── Footer ── */
.footer{text-align:center;padding:1.5rem;font-size:.75rem;color:var(--text2);border-top:1px solid var(--border)}

/* ── Theme button ── */
.theme-btn{position:fixed;bottom:1.2rem;right:1.2rem;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:1.15rem;cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.theme-btn:hover{border-color:var(--accent);transform:scale(1.1)}

/* ── Responsive ── */
@media(max-width:600px){
  .main{grid-template-columns:1fr;padding:.5rem 1rem 2rem}
  .navbar{padding:.6rem 1rem}
  .search-wrap{padding:.6rem 1rem .15rem}
  .stats{padding:.15rem 1rem .35rem}
}
</style>
</head>
<body>

<div class="navbar">

    AllHub

  <nav class="nav-3d" id="navPills">

</div>

<div class="search-wrap">

const CATEGORIES={m:"🎬 Movies & Shows",a:"🌸 Anime",g:"📖 Manga",t:"📡 Live TV & Sports"};
let activeCat='all';
let searchQuery='';

function getFiltered(){
  let items=[];
  if(activeCat==='all'){
    for(const k in DATA) items=items.concat(DATA[k].map(i=>({...i,cat:k})));
  } else {
    items=DATA[activeCat].map(i=>({...i,cat:activeCat}));
  }
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    items=items.filter(i=>i.name.toLowerCase().includes(q)||i.url.toLowerCase().includes(q));
  }
  return items;
}

function render(){
  const items=getFiltered();
  const grid=document.getElementById('mainGrid');
  const noRes=document.getElementById('noResults');
  const statsEl=document.getElementById('stats');

  grid.innerHTML='';

  if(!items.length){
    noRes.classList.add('show');
  } else {
    noRes.classList.remove('show');
    items.forEach(item=>{
      const card=document.createElement('a');
      card.href=item.url;
      card.target='_blank';
      card.rel='noopener noreferrer';
      card.className='card';
      let badges='';
      if(item.t==='trusted') badges+='<span class="badge badge-trusted">✓ Trusted</span>';
      if(item.t==='new') badges+='<span class="badge badge-new">✦ New</span>';

      const catIcon=CATEGORIES[item.cat]||'';

      card.innerHTML=`
        ${badges?`<div class="card-badge">${badges}</div>`:''}
        <div class="card-name">${item.name}</div>
        <div class="card-url">${item.url}</div>
        ${catIcon?`<div style="font-size:.68rem;color:var(--text2);margin-top:auto">${catIcon}</div>`:''}
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
      `;
      grid.appendChild(card);
    });
  }

  const totalItems=getFiltered().length;
  const totalSites=Object.values(DATA).reduce((s,a)=>s+a.length,0);
  statsEl.innerHTML=`<span>${totalItems} of ${totalSites} sites</span>`;
}

// Nav pills
document.querySelectorAll('.nav-pill').forEach(pill=>{
  pill.addEventListener('click',()=>{
    document.querySelectorAll('.nav-pill').forEach(p=>p.classList.remove('active'));
    pill.classList.add('active');
    activeCat=pill.dataset.cat;
    render();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQuery=e.target.value.trim();
  render();
});

// Theme
const themes=0,themeKeys=[0,1,2,3,4];
function cycleTheme(){
  let cur=parseInt(document.documentElement.dataset.theme)||0;
  cur=(cur+1)%5;
  document.documentElement.dataset.theme=cur;
  localStorage.setItem('allhub-theme',cur);
}

(function init(){
  const saved=localStorage.getItem('allhub-theme');
  if(saved!==null) document.documentElement.dataset.theme=parseInt(saved);
  render();
})();
</script>
